<!-- Registration and Login Forms -->
<div class="container py-5">
    <div class="row justify-content-center">
  
      <!-- Registration Form -->
      <div class="col-lg-6 mb-5 mb-lg-0">
        <div class="bg-light rounded-3 py-5 px-4 px-md-5">
          <div class="text-center mb-5">
            <h1 class="fw-bolder">Join Our Beauty Circle</h1>
            <p class="lead fw-normal text-muted mb-0">Sign up and unlock exclusive perks!</p>
          </div>
          <form id="registrationForm" novalidate>
            <!-- First and Last Name -->
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input
                    class="form-control"
                    id="firstName"
                    name="firstName"
                    type="text"
                    placeholder="First Name"
                    autocomplete="given-name"
                    required
                    aria-describedby="firstNameHelp"
                  />
                  <label for="firstName">First Name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input
                    class="form-control"
                    id="lastName"
                    name="lastName"
                    type="text"
                    placeholder="Last Name"
                    autocomplete="family-name"
                    required
                    aria-describedby="lastNameHelp"
                  />
                  <label for="lastName">Last Name</label>
                </div>
              </div>
            </div>
            <!-- Email -->
            <div class="form-floating mb-3">
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
                aria-describedby="emailHelp"
              />
              <label for="email">Email Address</label>
            </div>
            <!-- Password -->
            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input
                    class="form-control"
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Create Password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                    aria-describedby="passwordHelp"
                  />
                  <label for="password">Create Password</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input
                    class="form-control"
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    placeholder="Confirm Password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                    aria-describedby="confirmPasswordHelp"
                  />
                  <label for="confirmPassword">Confirm Password</label>
                </div>
              </div>
            </div>
            <!-- Phone Number -->
            <div class="form-floating mb-4">
              <input
                class="form-control"
                id="phone"
                name="phone"
                type="tel"
                placeholder="(123) 456-7890"
                pattern="^\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}$"
                autocomplete="tel"
                required
                aria-describedby="phoneHelp"
              />
              <label for="phone">Phone Number</label>
            </div>
            <!-- Submit Button -->
            <div class="d-grid">
              <button
                class="btn btn-primary btn-lg glow-button"
                id="registerButton"
                type="submit"
              >
                Get Started
              </button>
            </div>
          </form>
        </div>
      </div>
  
      <!-- Login Form -->
      <div class="col-lg-6">
        <div class="bg-light rounded-3 py-5 px-4 px-md-5">
          <div class="text-center mb-5">
            <h1 class="fw-bolder">Welcome Back</h1>
            <p class="lead fw-normal text-muted mb-0">
              Ready to glow? Log in to your account.
            </p>
          </div>
          <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="form-floating mb-3">
              <input
                class="form-control"
                id="loginEmail"
                name="loginEmail"
                type="email"
                placeholder="name@example.com"
                autocomplete="username"
                required
                aria-describedby="loginEmailHelp"
              />
              <label for="loginEmail">Email Address</label>
            </div>
            <!-- Password -->
            <div class="form-floating mb-4">
              <input
                class="form-control"
                id="loginPassword"
                name="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
                aria-describedby="loginPasswordHelp"
              />
              <label for="loginPassword">Password</label>
            </div>
            <!-- Submit Button -->
            <div class="d-grid">
              <button
                class="btn btn-primary btn-lg glow-button"
                id="loginButton"
                type="submit"
              >
                Let Me In
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
