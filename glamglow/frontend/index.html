<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Selena</title>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/spapp.css" rel="stylesheet" /> 
</head>

<body class="d-flex flex-column h-100">
    <main class="flex-shrink-0">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-5">
                <a class="navbar-brand" href="index.html">GlamGlow | The Beauty Bar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                        <li class="nav-item"><a class="nav-link" href="#pricing">Pricing</a></li>
                        <li class="nav-item"><a class="nav-link" href="#faq">FAQ</a></li>
                        <li class="nav-item"><a class="nav-link" href="#admin-dashboard">Admin Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
                        <li class="nav-item"><a class="nav-link" href="#auth">Join Us</a></li>
                        <li class="nav-item">
                            <button class="btn btn-link nav-link" type="button" id="openProfileModalBtn">My Profile (Test)</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main id="spapp" role="main">
            <section id="home" data-load="home.html"></section>
            <section id="about" data-load="about.html"></section>
            <section id="contact" data-load="contact.html"></section>
            <section id="pricing" data-load="pricing.html"></section>
            <section id="faq" data-load="faq.html"></section>
            <section id="admin-dashboard" data-load="admin-dashboard.html"></section>
            <section id="services" data-load="services.html"></section>
            <section id="auth" data-load="auth.html"></section>
        </main>

        <!-- Footer -->
        <footer class="sticky-footer bg-white">
            <div class="container my-auto">
                <div class="copyright text-center my-auto">
                    <span>Copyright &copy; International Burch University 2025</span>
                </div>
            </div>
        </footer>
        
        <div id="sparkleContainer" class="sparkle-container"></div>

        <!-- User Profile Modal -->
        <div class="modal fade" id="userProfileModal" tabindex="-1" aria-labelledby="userProfileModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form id="userProfileForm">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bolder" id="userProfileModalLabel">Hello, <span id="userNameHeader">User</span>!</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3 text-center position-relative" style="width:100px;margin:auto;">
                                <img id="profilePhotoPreview" src="assets/photos/staff-IC.jpg" alt="Profile Photo" class="rounded-circle mb-2" style="width:100px;height:100px;object-fit:cover;">
                                <button type="button" id="profilePhotoEditBtn" class="btn btn-sm btn-dark position-absolute top-50 start-50 translate-middle rounded-circle">
                                    <i class="bi bi-pencil-fill"></i>
                                </button>
                                <input type="file" id="profilePhoto" accept="image/*" style="display:none;">
                                <div id="photoOptionsDropdown" class="dropdown-menu text-center" style="position:absolute;top:110%;left:50%;transform:translateX(-50%);">
                                    <button type="button" class="dropdown-item" id="uploadPhotoBtn">Upload Photo</button>
                                    <button type="button" class="dropdown-item text-danger" id="deletePhotoBtn">Delete Photo</button>
                                </div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="profileFirstName" placeholder="First Name">
                                <label for="profileFirstName">First Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="profileLastName" placeholder="Last Name">
                                <label for="profileLastName">Last Name</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="profileEmail" placeholder="Email">
                                <label for="profileEmail">Email</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="tel" class="form-control" id="profilePhone" placeholder="Phone">
                                <label for="profilePhone">Phone</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="profilePassword" placeholder="New Password (optional)">
                                <label for="profilePassword">Password</label>
                            </div>
                        </div>
                        <div class="modal-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-primary" id="profileSaveBtn" disabled>Save Changes</button>
                            <button type="button" class="btn btn-outline-danger" id="logoutBtn">Logout</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.1.0.min.js" crossorigin="anonymous"></script>
    <script src="assets/js/jquery.spapp.min.js"></script>
    <script src="assets/js/custom.js"></script>
    <script src="assets/js/scripts.js"></script>
</body>
</html>
